[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archviz-geometry-guardian"
version = "0.2.0"
description = "Architecture-preservation QC for AI-assisted architectural visualization"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
cv = ["opencv-python-headless>=4.9"]
matching = ["scipy>=1.10"]
dev = [
  "pytest>=8",
  "opencv-python-headless>=4.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
